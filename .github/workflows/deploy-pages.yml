name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate CV PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found on runner"
            exit 1
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --no-pdf-header-footer             --print-to-pdf="$GITHUB_WORKSPACE/assets/Johan_Serrano_Hoja_de_Vida_2026.pdf"             "file://$GITHUB_WORKSPACE/cv.html"
          test -s "$GITHUB_WORKSPACE/assets/Johan_Serrano_Hoja_de_Vida_2026.pdf"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
